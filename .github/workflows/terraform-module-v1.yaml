name: Terraform module

on:
  workflow_call:
    inputs:
      terraform-version:
        description: "The version of terraform to use"
        required: false
        type: string
        default: "1.10"

jobs:
  tf-fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ github.event.inputs.terraform-version }}

      - name: Terraform fmt
        run: |
          terraform fmt -recursive -check | while IFS= read -r filename; do
            if [[ -f "$filename" ]]; then
              echo "::error file=$filename::invalid formatted file"
            fi
          done
          terraform fmt -recursive -check

  tf-lint:
    name: Run TFlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: terraform-linters/setup-tflint@6e1e0642c0289bd619021bf6b34e3c08ed1e005a # v6.3.0
        name: Install TFLint
        with:
          tflint_version: v0.44.1

      - name: Setup TFLint
        run: tflint --init
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run TFLint
        run: tflint -f compact --force

  tf-docs:
    name: Check Terraform docs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Check Terraform Docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          working-dir: ${{ inputs.working-directory }}
          output-file: "README.md"
          output-method: ""
          template: ""
          fail-on-diff: true

  check-changes:
    name: Check for Changelog updates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Filter for changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          base: main
          filters: |
            terraform:
              - added: '**.tf'
              - modified: '**.tf'
            unreleased:
              - added: .changes/unreleased/*.yaml

      - name: Output changes
        if:  ${{ steps.changes.outputs.unreleased == 'false' && steps.changes.outputs.terraform == 'true' }}
        run: |
          echo "No new changelog found in .changes/unreleased/ directory. Please add the necessary changes with Changie."
          exit 1

  release:
    name: Release module version
    runs-on: ubuntu-latest
    needs:
      - tf-fmt
      - tf-docs
      - tf-lint
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Prepare release
        uses: labd/changie-release-action@43112f435367957ee3fefc64b3b712c7e672be33 # v0.6.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
