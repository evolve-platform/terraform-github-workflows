name: Plan and apply

# A site's infrastructure, planned on a pull request and applied from the
# default branch, with Terraform or OpenTofu. Called from another repository
# with `uses:` and pinned by commit sha; the README describes the inputs and
# the identities.

on:
  workflow_call:
    inputs:
      environment:
        description: "The environment, such as tst or prd. The apply job runs in the GitHub environment of this name."
        required: true
        type: string
      mode:
        description: "plan, on a pull request, or apply, on the default branch."
        required: true
        type: string
      cloud:
        description: "gcp or azure: where the identities live."
        required: true
        type: string
      cli:
        description: "terraform or tofu."
        required: true
        type: string
      cli-version:
        description: "The version of the cli, such as 1.13.3."
        required: true
        type: string
      working-directory:
        description: "The directory holding the root module."
        required: false
        type: string
        default: "."
      backend-config:
        description: "The backend configuration file, relative to the working directory. Defaults to envs/<environment>.backend.hcl where that file exists."
        required: false
        type: string
        default: ""
      var-file:
        description: "The variables file, relative to the working directory. Defaults to envs/<environment>.tfvars where that file exists."
        required: false
        type: string
        default: ""
      comment:
        description: "Whether a plan is also posted as a comment on the pull request, besides the job summary."
        required: false
        type: boolean
        default: true
      gcp-workload-identity-provider:
        description: "gcp: the full name of the workload identity provider."
        required: false
        type: string
        default: ""
      gcp-plan-service-account:
        description: "gcp: the service account a plan runs as."
        required: false
        type: string
        default: ""
      gcp-apply-service-account:
        description: "gcp: the service account an apply runs as."
        required: false
        type: string
        default: ""
      azure-tenant-id:
        required: false
        type: string
        default: ""
      azure-subscription-id:
        required: false
        type: string
        default: ""
      azure-plan-client-id:
        description: "azure: the client id of the identity a plan runs as."
        required: false
        type: string
        default: ""
      azure-apply-client-id:
        description: "azure: the client id of the identity an apply runs as."
        required: false
        type: string
        default: ""

permissions: {}

jobs:
  plan:
    if: inputs.mode == 'plan'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    # One plan per pull request and environment; a newer push replaces it. The
    # state lock keeps a plan and an apply from overlapping.
    concurrency:
      group: plan-${{ github.repository }}-${{ inputs.environment }}-${{ github.ref }}
      cancel-in-progress: true
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CLOUD: ${{ inputs.cloud }}
      CLI: ${{ inputs.cli }}
      BACKEND_CONFIG: ${{ inputs.backend-config }}
      VAR_FILE: ${{ inputs.var-file }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - name: Check the inputs
        working-directory: .
        run: |
          case "$CLOUD" in gcp|azure) ;; *) echo "::error::cloud must be gcp or azure, not '$CLOUD'"; exit 1 ;; esac
          case "$CLI" in terraform|tofu) ;; *) echo "::error::cli must be terraform or tofu, not '$CLI'"; exit 1 ;; esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        if: inputs.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.cli-version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: inputs.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.cli-version }}
          tofu_wrapper: false

      - name: Sign in to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-plan-service-account }}

      - name: Sign in to Azure
        if: inputs.cloud == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure-plan-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Use the Azure identity in the providers
        if: inputs.cloud == 'azure'
        env:
          CLIENT_ID: ${{ inputs.azure-plan-client-id }}
          TENANT_ID: ${{ inputs.azure-tenant-id }}
          SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=$CLIENT_ID"
            echo "ARM_TENANT_ID=$TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - name: Init
        run: |
          set -euo pipefail
          backend="${BACKEND_CONFIG:-envs/$ENVIRONMENT.backend.hcl}"
          args=()
          if [ -n "$BACKEND_CONFIG" ] || [ -f "$backend" ]; then
            args+=("-backend-config=$backend")
          fi
          "$CLI" init -input=false -no-color -reconfigure "${args[@]}"

      - name: Plan
        run: |
          set -euo pipefail
          vars="${VAR_FILE:-envs/$ENVIRONMENT.tfvars}"
          args=()
          if [ -n "$VAR_FILE" ] || [ -f "$vars" ]; then
            args+=("-var-file=$vars")
          fi
          "$CLI" plan -input=false -no-color -lock-timeout=10m "${args[@]}" -out=tfplan

      # show prints a sensitive value as (sensitive value), so a secret reaches
      # the summary or the comment only when the configuration does not mark it
      # sensitive.
      - name: Write the plan to the summary
        run: |
          set -euo pipefail
          "$CLI" show -no-color tfplan > "$RUNNER_TEMP/plan.txt"
          {
            echo "### Plan: $ENVIRONMENT"
            echo
            echo '```'
            head -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment the plan on the pull request
        if: inputs.comment && github.event_name == 'pull_request'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require("node:fs");
            const environment = process.env.ENVIRONMENT;
            const marker = `<!-- infrastructure-plan:${environment} -->`;
            const limit = 60000;
            let plan = fs.readFileSync(process.env.PLAN_FILE, "utf8");
            if (plan.length > limit) {
              plan = `${plan.slice(0, limit)}\n… truncated; the full plan is in the job summary.`;
            }
            const body = `${marker}\n### Plan: ${environment}\n\n<details><summary>Show the plan</summary>\n\n\`\`\`\n${plan}\n\`\`\`\n\n</details>\n\n${context.sha}`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((comment) => comment.body?.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply:
    if: inputs.mode == 'apply'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
    # Applies of one environment run one at a time and are never cancelled.
    concurrency:
      group: apply-${{ github.repository }}-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ inputs.environment }}
      CLOUD: ${{ inputs.cloud }}
      CLI: ${{ inputs.cli }}
      BACKEND_CONFIG: ${{ inputs.backend-config }}
      VAR_FILE: ${{ inputs.var-file }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # An apply plans afresh from the default branch; a plan made on a pull
      # request is never applied.
      - name: Check the inputs and the branch
        working-directory: .
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          case "$CLOUD" in gcp|azure) ;; *) echo "::error::cloud must be gcp or azure, not '$CLOUD'"; exit 1 ;; esac
          case "$CLI" in terraform|tofu) ;; *) echo "::error::cli must be terraform or tofu, not '$CLI'"; exit 1 ;; esac
          if [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "::error::An apply runs only from the default branch, not from $GITHUB_REF"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        if: inputs.cli == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.cli-version }}
          terraform_wrapper: false

      - name: Set up OpenTofu
        if: inputs.cli == 'tofu'
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.cli-version }}
          tofu_wrapper: false

      - name: Sign in to Google Cloud
        if: inputs.cloud == 'gcp'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ inputs.gcp-workload-identity-provider }}
          service_account: ${{ inputs.gcp-apply-service-account }}

      - name: Sign in to Azure
        if: inputs.cloud == 'azure'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ inputs.azure-apply-client-id }}
          tenant-id: ${{ inputs.azure-tenant-id }}
          subscription-id: ${{ inputs.azure-subscription-id }}

      - name: Use the Azure identity in the providers
        if: inputs.cloud == 'azure'
        env:
          CLIENT_ID: ${{ inputs.azure-apply-client-id }}
          TENANT_ID: ${{ inputs.azure-tenant-id }}
          SUBSCRIPTION_ID: ${{ inputs.azure-subscription-id }}
        run: |
          {
            echo "ARM_USE_OIDC=true"
            echo "ARM_CLIENT_ID=$CLIENT_ID"
            echo "ARM_TENANT_ID=$TENANT_ID"
            echo "ARM_SUBSCRIPTION_ID=$SUBSCRIPTION_ID"
          } >> "$GITHUB_ENV"

      - name: Init
        run: |
          set -euo pipefail
          backend="${BACKEND_CONFIG:-envs/$ENVIRONMENT.backend.hcl}"
          args=()
          if [ -n "$BACKEND_CONFIG" ] || [ -f "$backend" ]; then
            args+=("-backend-config=$backend")
          fi
          "$CLI" init -input=false -no-color -reconfigure "${args[@]}"

      - name: Apply
        run: |
          set -euo pipefail
          vars="${VAR_FILE:-envs/$ENVIRONMENT.tfvars}"
          args=()
          if [ -n "$VAR_FILE" ] || [ -f "$vars" ]; then
            args+=("-var-file=$vars")
          fi
          "$CLI" apply -input=false -no-color -lock-timeout=10m -auto-approve "${args[@]}"
